readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "strands-agents[ollama]>=1.58.1",
    "textual>=0.80",
]

[dependency-groups]
dev = [
    "cairosvg>=2.9.1",
    "pillow>=12.3.0",
]
